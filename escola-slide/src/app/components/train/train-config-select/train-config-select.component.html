<div class="wizard-step">
  <!-- Título da Tela -->
  <h2 class="titulo-card" >Treinar &gt; Selecionar Manobras</h2>

  <!-- Barra de Pesquisa -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Pesquisar manobras..."
      [(ngModel)]="searchTerm"
      (input)="onSearchChange()"
    />
  </div>

  <!-- Grid de Manobras -->
  <div class="manobras-grid">
    <div
      class="manobra-card"
      *ngFor="let manobra of filteredManobras"
      (click)="toggleManobra(manobra)"
    >
      <!-- Checkbox ou ícone de seleção -->
      <input
        type="checkbox"
        class="manobra-checkbox"
        [checked]="isSelected(manobra)"
        (click)="$event.stopPropagation()"
        (change)="toggleManobra(manobra)"
      />

      <!-- Informações da Manobra -->
      <div class="manobra-info">
        <strong>{{ manobra.nome }}</strong>
        <p>{{ manobra.descricao }}</p>
      </div>
    </div>
  </div>

  <!-- Lista de Manobras Selecionadas -->
  <div class="selected-list">
    <h3>Manobras Selecionadas ({{ selectedManobras.length }})</h3>
    <div class="selected-item" *ngFor="let sel of selectedManobras">
      <span>{{ sel.nome }}</span>
      <button (click)="removeManobra(sel)">Remover</button>
    </div>
  </div>

</div>
